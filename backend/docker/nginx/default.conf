# RIVA-113: nginx config for the backend service — proxies PHP requests to
# the php-fpm container over FastCGI. Kept deliberately close to Laravel's
# own documented nginx recipe; no custom rewriting beyond what Laravel's
# public/index.php front controller needs.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 90;
    }

    # SECURITY: never serve dotfiles (.env, .git, etc.) even if something
    # ends up under public/ by mistake.
    location ~ /\. {
        deny all;
    }
}
