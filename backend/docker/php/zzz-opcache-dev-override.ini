; RIVA-113: local-dev-only override, bind-mounted by the root
; docker-compose.yml into /usr/local/etc/php/conf.d/ alongside the image's
; baked-in files. PHP loads conf.d/*.ini in alphabetical order, and later
; files win on conflicting directives — the "zzz-" prefix guarantees this
; loads after opcache.ini (whose validate_timestamps=0 assumes an
; immutable image per deploy, wrong for local dev where backend/ is
; bind-mounted and edited live).
opcache.validate_timestamps=1
opcache.revalidate_freq=0
