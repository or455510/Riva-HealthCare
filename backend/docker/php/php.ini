; RIVA-113: conservative production PHP settings. Nothing here changes
; application behavior — these are resource/error-display settings only.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 60

; PHI (audit §19, "no medical certainty claims"/"no PHI in logs" applies to
; app-level logging, but display_errors=Off here is the same principle at
; the PHP-engine level: never let a raw stack trace containing patient
; data reach a client response in production).
display_errors = Off
log_errors = On
