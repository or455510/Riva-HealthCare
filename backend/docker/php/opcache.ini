; RIVA-113 (directive §18/§21): OPcache for production.
; validate_timestamps=0 assumes an immutable image per deploy (see the
; Dockerfile comment) — docker-compose.yml's dev override sets this back
; to 1 so bind-mounted local edits are picked up without a container
; restart.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=tracing
opcache.jit_buffer_size=64M
