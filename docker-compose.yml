# RIVA-113 (directive §18): local development orchestration for the
# existing Laravel monolith + Angular SSR frontend. Deliberately NOT
# Kubernetes and NOT a microservices split — five containers, one of each
# real component this app already has (db, cache, php-fpm app, nginx,
# frontend). Production deployment is expected to use the same two
# Dockerfiles (backend/Dockerfile, Riva-master/Dockerfile) behind whatever
# the operator's real infrastructure is (a single VM, a managed container
# host, etc.) — this compose file is for local dev / CI, not a production
# topology prescription.
#
# Before first use: copy backend/.env.example to backend/.env and fill in
# real values (see backend/.env.example for the full list) — this compose
# file does NOT create or modify backend/.env itself, matching the
# project's existing rule that .env is never machine-written.
name: riva

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-riva_final}
      MYSQL_USER: ${DB_USERNAME:-riva}
      MYSQL_PASSWORD: ${DB_PASSWORD:-riva}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - riva-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - riva-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    volumes:
      # Bind-mount source for live local-dev editing, plus an ini override
      # (see docker/php/zzz-opcache-dev-override.ini) that flips OPcache's
      # validate_timestamps back to 1 so PHP actually notices file changes
      # without a container restart — the image's baked-in default is 0,
      # correct for an immutable production image but wrong here.
      - ./backend:/var/www/html
      - riva-backend-vendor:/var/www/html/vendor
      - ./backend/docker/php/zzz-opcache-dev-override.ini:/usr/local/etc/php/conf.d/zzz-opcache-dev-override.ini:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./Riva-master
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"

volumes:
  riva-mysql-data:
  riva-redis-data:
  riva-backend-vendor:
